project_id = "mednet"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://localhost:5173", "http://127.0.0.1:5173"]
jwt_expiry = 3600
enable_signup = true

# This function is called by a database trigger with TRIGGER_SECRET rather than
# an end-user JWT. Authentication is enforced inside the function and must fail
# closed when the secret is absent.
[functions.append-sheet]
verify_jwt = false

[functions.read-sheet]
verify_jwt = true

[functions.invite-user]
verify_jwt = true

[functions.generate-report]
verify_jwt = true

[functions.generate-dossier-report]
verify_jwt = true

[functions.process-driver-document]
verify_jwt = true
